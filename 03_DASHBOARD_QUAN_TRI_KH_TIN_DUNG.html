<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Quản trị Khách hàng & Chất lượng Tín dụng – CN Sài Gòn</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2d3d;--mut:#78889c;--line:#e3eaf3;--brand:#1f4e79;--brand2:#2e6ca4;
--do:#e05252;--doBg:#fdecec;--cam:#e08a2e;--camBg:#fdf2e3;--vang:#c9a227;--vangBg:#fbf6e0;--xam:#8b97a6;--xamBg:#eef1f5;
--xanh:#2e9e6b;--xanhBg:#e6f5ee;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.wrap{max-width:1560px;margin:0 auto;padding:14px}
header{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;border-radius:var(--r);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600}header .sub{font-size:12px;opacity:.85;margin-top:2px}
.hf{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hf label{font-size:11px;opacity:.85;display:block;margin-bottom:2px}
.hf select,.hf input{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;font-size:13px;min-width:170px}
.hf select option{background:#1f4e79;color:#fff}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;color:var(--mut);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit}
nav button:hover{color:var(--ink);border-color:#c7d6e6}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
nav button .bdg{background:var(--do);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(31,78,121,.08);border-left:4px solid var(--brand)}
.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi.do{border-left-color:var(--do)}.kpi.do .v{color:var(--do)}
.kpi.cam{border-left-color:var(--cam)}.kpi.cam .v{color:var(--cam)}
.kpi.vang{border-left-color:var(--vang)}.kpi.vang .v{color:#a8871d}
.kpi.xam{border-left-color:var(--xam)}.kpi.xam .v{color:var(--xam)}
.kpi.xanh{border-left-color:var(--xanh)}.kpi.xanh .v{color:var(--xanh)}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 3px rgba(31,78,121,.08);margin-bottom:14px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:12px;color:var(--brand)}
.card h3 .n{font-weight:400;color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;padding:8px 9px;border-bottom:2px solid var(--line);color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--brand)}
td{padding:7px 9px;border-bottom:1px solid #f2f5f9;vertical-align:top}
tbody tr:hover{background:#f7fafd}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.p-do{background:var(--doBg);color:var(--do)}.p-cam{background:var(--camBg);color:var(--cam)}
.p-vang{background:var(--vangBg);color:#9c7f1c}.p-xam{background:var(--xamBg);color:var(--xam)}
.p-xanh{background:var(--xanhBg);color:var(--xanh)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;padding:5px 13px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut);font-family:inherit}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip.on.do{background:var(--do);border-color:var(--do)}.chip.on.cam{background:var(--cam);border-color:var(--cam)}
.chip.on.vang{background:var(--vang);border-color:var(--vang)}.chip.on.xam{background:var(--xam);border-color:var(--xam)}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12.5px}
.bar .lb{width:150px;flex-shrink:0;color:var(--mut);text-align:right}
.bar .tr{flex:1;background:#eef3f8;border-radius:4px;height:19px;position:relative;overflow:hidden}
.bar .fi{height:100%;border-radius:4px;background:var(--brand2)}
.bar .vl{width:118px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}
input.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:11px;font-size:12.5px;color:var(--mut)}
.pg button{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12.5px}
.pg button:disabled{opacity:.4;cursor:default}
.empty{padding:34px;text-align:center;color:var(--mut)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:13px}
.kv .k{color:var(--mut)}.kv .v{font-weight:600}
footer{color:var(--mut);font-size:11.5px;padding:14px 4px 22px;line-height:1.7}
.warnbox{background:var(--doBg);border-left:4px solid var(--do);padding:11px 14px;border-radius:6px;font-size:12.8px;margin-bottom:12px}
.notebox{background:#eef4fb;border-left:4px solid var(--brand2);padding:11px 14px;border-radius:6px;font-size:12.8px;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.hide{display:none}
.amc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--do);border-radius:var(--r);padding:13px 15px}
.amc .tag{font-size:10.5px;font-weight:800;letter-spacing:.9px;color:var(--mut);text-transform:uppercase}
.amc .nm{font-size:15.5px;font-weight:800;margin-top:5px}
.amc .tel{display:inline-block;font-size:15px;font-weight:800;color:var(--brand2);text-decoration:none;margin-top:1px}
.amc .tt{font-size:12.5px;color:var(--cam);font-weight:600;margin-top:4px}
.amc .stat{font-size:12px;color:var(--mut);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.7}
.amc .stat b{color:var(--ink)}
details.ac{margin-top:7px;border-top:1px solid #eef2f7;padding-top:6px}
details.ac>summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;color:var(--brand2);padding:3px 0;user-select:none;display:flex;align-items:center;gap:7px}
details.ac>summary::-webkit-details-marker{display:none}
details.ac>summary:before{content:'▸';font-size:11px;transition:transform .15s;display:inline-block}
details.ac[open]>summary:before{transform:rotate(90deg)}
details.ac>summary:hover{color:var(--brand)}
details.ac.warn>summary{color:var(--do)}
details.ac .bd{font-size:12.6px;white-space:pre-wrap;line-height:1.6;padding:8px 11px;margin:5px 0 3px;background:#fbfcfe;border-left:3px solid var(--line);border-radius:4px}
details.ac .bd h5{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:9px 0 3px;font-weight:800}
details.ac .bd h5:first-child{margin-top:0}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;align-items:start;margin-top:11px}
.secgrid details.ac{margin:0;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;transition:box-shadow .12s}
.secgrid details.ac:hover{box-shadow:0 1px 5px rgba(31,78,121,.10)}
.secgrid details.ac>summary{padding:0;font-size:12.5px;line-height:1.3}
.secgrid details.ac[open]{grid-column:1/-1;border-color:var(--brand2);box-shadow:0 1px 6px rgba(31,78,121,.12)}
.secgrid details.ac[open]>summary{padding-bottom:5px;border-bottom:1px solid var(--line)}
.secgrid details.ac.warn{border-color:#f3d3d3}
.secgrid details.ac.warn[open]{border-color:var(--do)}
.secgrid details.ac .bd{margin:7px 0 1px}
@media(max-width:640px){.secgrid{grid-template-columns:1fr}}
details.cell>summary{cursor:pointer;list-style:none;display:flex;gap:5px;align-items:flex-start;white-space:normal;line-height:1.4}
details.cell>summary::-webkit-details-marker{display:none}
details.cell>summary:before{content:'▸';color:var(--brand2);font-size:10px;flex-shrink:0;margin-top:2px;font-weight:700}
details.cell[open]>summary:before{content:'▾'}
details.cell>summary:hover{color:var(--brand2)}
details.cell .cb{white-space:normal;line-height:1.55;margin-top:5px;padding:7px 9px;background:#fbfcfe;border-left:2px solid var(--line);border-radius:3px}
td.wrap{overflow:visible}
details.ac .chua{font-size:10.5px;font-weight:600;color:var(--xam);background:var(--xamBg);padding:1px 7px;border-radius:20px;margin-left:4px}
th.thw{white-space:normal;line-height:1.25}
tbody tr{background:var(--card)}
tbody tr:hover{background:#f7fafd}
th.stick,td.stick{position:sticky;left:0;z-index:3;background:inherit;box-shadow:1px 0 0 var(--line)}
thead th.stick{z-index:5;background:var(--card)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:820px){
 .wrap{padding:8px}
 header{padding:12px 14px}header h1{font-size:15px}
 .hf select,.hf input{min-width:135px;font-size:12.5px}
 nav button{padding:7px 11px;font-size:12.5px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
 .kpi{padding:11px 12px}.kpi .v{font-size:20px}.kpi .l{font-size:10.5px}
 .grid2,.grid3{grid-template-columns:1fr}
 .card{padding:12px 12px}
 .tw table{min-width:820px}
 .bar .lb{width:96px;font-size:11.5px}.bar .vl{width:88px}
 .kv{grid-template-columns:118px 1fr;font-size:12.5px}
 table{font-size:12px}td{padding:6px 7px}th{padding:6px 7px}
 th.stick,td.stick{max-width:126px}
}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}
td.wrap{white-space:normal;word-break:break-word}
table td,table th{overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit}
.btn:hover{background:var(--brand);color:#fff}
.btn.g{border-color:var(--xanh);color:var(--xanh)}.btn.g:hover{background:var(--xanh);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{
 body{background:#fff}
 .wrap{max-width:none;padding:0}
 header,nav,.noprint,.pg,footer{display:none!important}
 .card,.kpi{box-shadow:none;border:1px solid #d5dee8;break-inside:avoid}
 .kpis{grid-template-columns:repeat(4,1fr)}
 table{font-size:10.5px}th{font-size:9.5px}
 .printhead{display:block!important;margin-bottom:10px;border-bottom:2px solid #1f4e79;padding-bottom:8px}
 #page>.card:first-child{border-left:4px solid #1f4e79}
 a[href]:after{content:''}
 @page{size:A4 landscape;margin:10mm}
}
.printhead{display:none}
</style></head><body><div class="wrap">

<script>
// Dữ liệu nhúng dạng gzip + base64 để giảm ~77% dung lượng file
let D,M,KH,KV,TS,CB;
const cifRM={},cifTen={};
function tab(o){const c={};o.cols.forEach((k,i)=>c[k]=i);return o.rows.map(r=>{const x={};o.cols.forEach((k,i)=>x[k]=r[i]);return x});}
async function napDuLieu(){
 const b64=document.getElementById('DATA_GZ').textContent.replace(/\s+/g,'');
 const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==='undefined')throw new Error('KHONG_HO_TRO');
 const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
 return JSON.parse(await new Response(st).text());
}
const n0=v=>v==null?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:0});
const n1=v=>v==null?'—':Number(v).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1});
const pc=v=>v==null?'—':Number(v).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const esc=s=>s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MUC=['ĐỎ','CAM','VÀNG','XÁM'],CLS={'ĐỎ':'do','CAM':'cam','VÀNG':'vang','XÁM':'xam'};
let F={rm:'',nn:'',dn:0},PAGE='cb';
const LS={get(k,d){try{const v=localStorage.getItem('mbdash_'+k);return v==null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem('mbdash_'+k,v)}catch(e){}}};

// ---------- LỌC ----------
const noF=()=>!F.rm&&!F.nn&&!F.dn;
function khF(){return noF()?KH:KH.filter(k=>(!F.rm||k.TEN_RM===F.rm)&&(!F.nn||String(k.NHOM_NO_HIEN_TAI)===F.nn)&&(k.TONG_DU_NO_TRD||0)>=F.dn)}
function cifSet(){return new Set(khF().map(k=>String(k.CIF)))}
function kvF(){if(noF())return KV;const s=cifSet();return KV.filter(v=>s.has(String(v.CIF)))}
function tsF(){if(noF())return TS;const s=cifSet();return TS.filter(t=>s.has(String(t.CIF_DUOC_BAO_DAM)))}
function cbF(){if(noF())return CB;const s=cifSet();return CB.filter(c=>c.CIF!=null&&s.has(String(c.CIF)))}

// ---------- WIDGET ----------
function kpi(l,v,s,cls){return `<div class="kpi ${cls||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`}
function bars(rows,fmt){const mx=Math.max(1,...rows.map(r=>Math.abs(r[1])));
 return rows.map(r=>`<div class="bar"><div class="lb">${esc(r[0])}</div><div class="tr"><div class="fi" style="width:${Math.max(1,Math.abs(r[1])/mx*100)}%;${r[2]?'background:'+r[2]:''}"></div></div><div class="vl">${(fmt||n0)(r[1])}</div></div>`).join('')}
function donut(rows){const tot=rows.reduce((a,b)=>a+b[1],0)||1;let ang=-90,seg='';
 const CO=['#2e6ca4','#57a0d3','#7fbfa0','#e0b252','#d98d5f','#a58cc4','#8b97a6'];
 rows.forEach((r,i)=>{const a=r[1]/tot*360,e=ang+a,rd=Math.PI/180,R=68,r2=42,cx=80,cy=80;
  const x1=cx+R*Math.cos(ang*rd),y1=cy+R*Math.sin(ang*rd),x2=cx+R*Math.cos(e*rd),y2=cy+R*Math.sin(e*rd);
  const x3=cx+r2*Math.cos(e*rd),y3=cy+r2*Math.sin(e*rd),x4=cx+r2*Math.cos(ang*rd),y4=cy+r2*Math.sin(ang*rd);
  const la=a>180?1:0;
  seg+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${la} 1 ${x2} ${y2}L${x3} ${y3}A${r2} ${r2} 0 ${la} 0 ${x4} ${y4}Z" fill="${CO[i%CO.length]}"><title>${esc(r[0])}: ${n0(r[1])}</title></path>`;ang=e});
 const lg=rows.map((r,i)=>`<div style="font-size:12px;margin-bottom:4px"><i style="width:11px;height:11px;border-radius:3px;display:inline-block;background:${CO[i%CO.length]};margin-right:6px"></i>${esc(r[0])} <b>${n0(r[1])}</b> (${(r[1]/tot*100).toFixed(1)}%)</div>`).join('');
 return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">${seg}</svg><div style="flex:1;min-width:200px">${lg}</div></div>`}

function toCSV(cols,rows){
 const esc2=v=>{if(v==null)return'';let s=String(v).replace(/<[^>]*>/g,'').replace(/"/g,'""');return /[",;\n]/.test(s)?'"'+s+'"':s};
 const L=[cols.map(c=>esc2(c.t)).join(',')];
 rows.forEach(r=>L.push(cols.map(c=>esc2(r[c.k])).join(',')));
 return '\uFEFF'+L.join('\r\n')}
function dl(name,text,mime){
 const b=new Blob([text],{type:(mime||'text/csv')+';charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
 document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},400)}
function stamp(){return M.ngay_chot.replace(/\//g,'')}
function inTrang(){window.print()}
// So sánh số an toàn: trong JS null>=0 là TRUE nên phải loại null trước
const inR=(v,a,b)=>v!=null&&v>=a&&v<=b;   // v trong [a,b]
const lt0=v=>v!=null&&v<0;                // v < 0
const ge0=v=>v!=null&&v>=0;               // v >= 0
// Ô văn bản dài trong bảng: thu gọn 1 dòng, bấm mũi tên mới bung
const oGap=(v,n)=>{if(!v)return'—';const t=String(v),k=n||58;
 return t.length<=k?esc(t):`<details class="cell"><summary>${esc(t.slice(0,k))}…</summary><div class="cb">${esc(t)}</div></details>`};
const SORT={};
function table(id,cols,rows,opt){opt=opt||{};const ps=opt.pageSize||40;
 const st=SORT[id]||(SORT[id]={col:opt.sort||null,dir:opt.dir||'desc',page:0});
 let d=rows.slice();
 if(st.col){d.sort((a,b)=>{let x=a[st.col],y=b[st.col];if(x==null)return 1;if(y==null)return -1;
   const c=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'vi');return st.dir==='asc'?c:-c})}
 const tot=d.length,np=Math.max(1,Math.ceil(tot/ps));if(st.page>=np)st.page=0;
 const pd=d.slice(st.page*ps,st.page*ps+ps);
 if(!tot)return `<div class="empty">Không có dữ liệu phù hợp bộ lọc.</div>`;
 let h='<div class="tw"><table'+(opt.fixed?' style="table-layout:fixed;width:100%"':'')+'><thead><tr>'+cols.map(c=>`<th onclick="srt('${id}','${c.k}')" class="${c.n?'num ':''}${c.w?'thw ':''}${(opt.sticky&&cols.indexOf(c)===0)?'stick':''}"${c.w?` style="width:${c.w}"`:''}>${c.t}${st.col===c.k?(st.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
 pd.forEach(r=>{h+='<tr'+(opt.rowFill&&opt.rowFill(r)?` style="background:${opt.rowFill(r)}"`:'')+'>'+cols.map((c,ci)=>`<td class="${c.n?'num ':''}${c.wrap?'wrap ':''}${(opt.sticky&&ci===0)?'stick':''}">${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join('')+'</tr>'});
 h+='</tbody></table></div>';
 h+=`<div class="pg"><span>Hiển thị ${tot?st.page*ps+1:0}–${Math.min(tot,(st.page+1)*ps)} / ${n0(tot)} dòng</span>
  <button onclick="pgo('${id}',-1)" ${st.page===0?'disabled':''}>‹ Trước</button>
  <button onclick="pgo('${id}',1)" ${st.page>=np-1?'disabled':''}>Sau ›</button></div>`;
 return h}
function srt(id,c){const s=SORT[id];if(s.col===c)s.dir=s.dir==='asc'?'desc':'asc';else{s.col=c;s.dir='desc'}s.page=0;render()}
function pgo(id,d){SORT[id].page+=d;render()}
// ================= TRANG 1: CẢNH BÁO =================
let CBMODE=LS.get('cbmode','NV'), CBMUC=LS.get('cbmuc',''), CBQT='';
function pageCB(){
 const all=cbF();
 const nv=all.filter(c=>c.MUC_DO!=='XÁM'), dl=all.filter(c=>c.MUC_DO==='XÁM');
 const cur=CBMODE==='NV'?nv:dl;
 let d=cur.filter(c=>(!CBMUC||c.MUC_DO===CBMUC)&&(!CBQT||c.MA_QUY_TAC===CBQT));
 const cnt=m=>all.filter(c=>c.MUC_DO===m).length;
 const rmn=new Set(all.filter(c=>c.MUC_DO!=='XÁM').map(c=>c.TEN_RM)).size||1;
 let h=`<div class="kpis">
  ${kpi('ĐỎ – Khẩn cấp',n0(cnt('ĐỎ')),'Xử lý trong 3 ngày','do')}
  ${kpi('CAM – Rủi ro cao',n0(cnt('CAM')),'Xử lý trong 7 ngày','cam')}
  ${kpi('VÀNG – Theo dõi',n0(cnt('VÀNG')),'Xử lý trong 15 ngày','vang')}
  ${kpi('XÁM – Dọn dữ liệu',n0(cnt('XÁM')),'Rà soát hồ sơ theo đợt','xam')}
  ${kpi('Việc nghiệp vụ / RM',n0(Math.round(nv.length/rmn)),`${n0(nv.length)} việc / ${rmn} RM`)}
  ${(()=>{const c=new Set(nv.filter(x=>x.MUC_DO!=='VÀNG').map(x=>x.CIF));
    const s=khF().filter(k=>c.has(String(k.CIF))).reduce((a,b)=>a+(b.TONG_DU_NO_TRD||0),0);
    return kpi('Dư nợ KH có CB ĐỎ/CAM',n1(s/1000)+' tỷ',n0(c.size)+' khách hàng','cam')})()}
 </div>`;
 CBX=d0=>0;
 h+=`<div class="card"><div class="acts noprint" style="justify-content:flex-end;margin-bottom:10px">
   <button class="btn g" onclick="xuatCB()">⤓ Xuất Excel danh sách cảnh báo đang lọc</button></div>
  <div class="chips">
   <button class="chip ${CBMODE==='NV'?'on':''}" onclick="setCB('mode','NV')">⚑ Xử lý nghiệp vụ (${n0(nv.length)})</button>
   <button class="chip ${CBMODE==='DL'?'on xam':''}" onclick="setCB('mode','DL')">⚙ Dọn dữ liệu (${n0(dl.length)})</button>
   <span style="width:18px"></span>`;
 if(CBMODE==='NV'){h+=`<button class="chip ${!CBMUC?'on':''}" onclick="setCB('muc','')">Tất cả mức</button>`+
   ['ĐỎ','CAM','VÀNG'].map(m=>`<button class="chip ${CBMUC===m?'on '+CLS[m]:''}" onclick="setCB('muc','${m}')">${m} (${n0(nv.filter(c=>c.MUC_DO===m).length)})</button>`).join('')}
 h+=`</div><div class="chips">`;
 const qts=[...new Set(cur.map(c=>c.MA_QUY_TAC))].sort();
 h+=`<button class="chip ${!CBQT?'on':''}" onclick="setCB('qt','')">Mọi loại cảnh báo</button>`+
   qts.map(q=>`<button class="chip ${CBQT===q?'on':''}" onclick="setCB('qt','${q}')">${q} · ${esc(QTEN[q]||'')} (${n0(cur.filter(c=>c.MA_QUY_TAC===q).length)})</button>`).join('');
 h+='</div>';
 CBVIEW=d;
 h+=table('cbt',[
  {k:'TEN_KHACH_HANG',t:'Khách hàng',f:(v,r)=>`${esc(v)}<div style="color:#78889c;font-size:10.5px">CIF ${esc(r.CIF)||'—'}</div>`,w:'15%'},
  {k:'MUC_DO',t:'Mức',f:v=>`<span class="pill p-${CLS[v]}">${v}</span>`,w:'6%'},
  {k:'MA_QUY_TAC',t:'Loại',w:'6%'},
  {k:'TEN_RM',t:'RM',w:'10%'},
  {k:'DOI_TUONG',t:'Đối tượng',wrap:1,w:'10%'},
  {k:'NOI_DUNG_CANH_BAO',t:'Nội dung cảnh báo',f:v=>`<div style="max-width:230px;white-space:normal">${esc(v)}</div>`},
  {k:'NGUYEN_NHAN',t:'Nguyên nhân',f:v=>`<div style="max-width:520px;white-space:normal">${esc(v)}</div>`},
  {k:'SO_TIEN_LIEN_QUAN_TRD',t:'Số tiền',n:1,f:n0,w:'7%'},
  {k:'HANH_DONG_RM_CAN_LAM',t:'RM cần làm',f:v=>`<div style="max-width:300px;white-space:normal">${esc(v)}</div>`},
  {k:'HAN_HOAN_THANH',t:'Hạn',w:'7%'}],d,{sort:'SO_TIEN_LIEN_QUAN_TRD',pageSize:40,sticky:1});
 return h+'</div>'}
const QTEN={CB01:'Nợ nhóm 2',CB02:'Nợ xấu 3–5',CB03:'Quá hạn',CB04:'Chuyển nhóm xấu',CB05:'Dư nợ lớn',CB06:'Sắp đáo hạn',
 CB07:'Sắp hết HTLS',CB09:'Định giá lại',CB09b:'Thiếu ngày ĐGL',CB10:'Bảo hiểm',CB10b:'Thiếu ngày BH',
 CB13:'Khai có TSBĐ, thiếu hồ sơ',CB14:'Thiếu RM',CB20:''};
let CBVIEW=[],CBX;
function xuatCB(){
 const cols=[{k:'MA_CANH_BAO',t:'Mã cảnh báo'},{k:'MUC_DO',t:'Mức độ'},{k:'MA_QUY_TAC',t:'Loại'},
  {k:'CIF',t:'CIF'},{k:'TEN_KHACH_HANG',t:'Khách hàng'},{k:'MA_RM',t:'Mã RM'},{k:'TEN_RM',t:'RM quản lý'},
  {k:'DOI_TUONG',t:'Đối tượng'},{k:'NOI_DUNG_CANH_BAO',t:'Nội dung cảnh báo',f:v=>`<div style="max-width:230px;white-space:normal">${esc(v)}</div>`},{k:'NGUYEN_NHAN',t:'Nguyên nhân',f:v=>`<div style="max-width:520px;white-space:normal">${esc(v)}</div>`},
  {k:'SO_TIEN_LIEN_QUAN_TRD',t:'Số tiền liên quan (trđ)'},{k:'HANH_DONG_RM_CAN_LAM',t:'Việc RM cần làm'},
  {k:'HAN_HOAN_THANH',t:'Hạn hoàn thành'},{k:'NGUON_DU_LIEU',t:'Nguồn dữ liệu'}];
 const src=CBVIEW.map(r=>{const o=CB.find(x=>x.MA_CANH_BAO===r.MA_CANH_BAO);return o||r});
 const t=(F.rm?'_'+F.rm.replace(/\s+/g,''):'')+(CBMUC?'_'+CBMUC:'')+(CBQT?'_'+CBQT:'');
 dl('CANH_BAO_'+stamp()+t+'.csv',toCSV(cols,src));}
function setCB(k,v){if(k==='mode'){CBMODE=v;CBMUC='';CBQT='';LS.set('cbmode',v)}if(k==='muc'){CBMUC=v;LS.set('cbmuc',v)}if(k==='qt')CBQT=v;if(SORT.cbt)SORT.cbt.page=0;render()}

// ================= TRANG 2: TỔNG QUAN & CHẤT LƯỢNG NỢ =================
function pageTQ(){
 const kh=khF(),kv=kvF(),ts=tsF(),cb=cbF();
 const tot=kv.reduce((a,b)=>a+(b.DU_NO_TRD||0),0);

 const nx=byN(3)+byN(4)+byN(5), n2=byN(2);

 const dhTC=dhLD.filter(v=>v.CO_TSBD_T24==='YES'&&inR(v.SO_NGAY_DEN_DAO_HAN,0,90)).length;
 let h=`<div class="kpis">

   <select id="ttNgay" onchange="setTTN(this.value)" style="padding:7px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;min-width:255px">
    <option value="">Tất cả ngày trong tháng ${M.thang_lai} (${n0(nKH(rows))} KH)</option>
    ${dKeys.map(dd=>`<option value="${dd}" ${String(TTNGAY)===String(dd)?'selected':''}>${dOpt[dd].ngay}${dd<refD?' · đã qua':(dd-refD<=7?' · sắp đến':'')} — ${n0(dOpt[dd].kh.size)} KH · ${n0(dOpt[dd].t)} trđ</option>`).join('')}
   </select>
   ${TTNGAY?`<button class="chip on" onclick="setTTN('')">✕ Bỏ lọc ngày ${esc(dOpt[TTNGAY]?dOpt[TTNGAY].ngay:TTNGAY)}</button>`:''}
  </div>
  <div class="chips">
   <button class="chip ${!TTLOC?'on':''}" onclick="setTT('')">Tất cả (${n0(rows.length)})</button>
   <button class="chip ${TTLOC==='sap'?'on cam':''}" onclick="setTT('sap')">Đến hạn trong 7 ngày (${n0(sapTT.length)})</button>
   <button class="chip ${TTLOC==='toi'?'on':''}" onclick="setTT('toi')">Còn lại trong tháng (${n0(toiTT.length)})</button>
   <button class="chip ${TTLOC==='qua'?'on':''}" onclick="setTT('qua')">Đã qua (${n0(quaTT.length)})</button>
   <span style="flex:1"></span>
   <button class="btn g noprint" onclick="xuatTT()">⤓ Xuất Excel danh sách nhắc</button></div>`;
 TTVIEW=d;
 h+=table('ttt',[
  {k:'TEN_KHACH_HANG',t:'Khách hàng',f:(v,r)=>`${esc(v)}<div style="color:#78889c;font-size:10.5px">CIF ${esc(r.CIF)}</div>`,w:'20%'},
  {k:'TEN_RM',t:'RM',w:'14%'},
  {k:'NGAY',t:'Ngày thanh toán',w:'11%',f:v=>`<b>${esc(v)}</b>`},
  {k:'CON',t:'Còn',n:1,w:'8%',f:v=>v<0?`<span class="pill p-xanh">đã qua ${-v}n</span>`:(v===0?'<span class="pill p-do">HÔM NAY</span>':(v<=7?`<span class="pill p-cam">${v} ngày</span>`:n0(v)+' ngày'))},
  {k:'NOI_DUNG',t:'Thu',w:'8%'},
  {k:'SO_KHE_UOC',t:'Khế ước',n:1,f:n0,w:'7%'},
  {k:'GOC',t:'Gốc (trđ)',n:1,f:v=>v?n0(v):'—',w:'10%'},
  {k:'LAI',t:'Lãi ước tính (trđ)',n:1,f:v=>v?n0(v):'—',w:'11%'},
  {k:'TONG',t:'Tổng phải thu (trđ)',n:1,f:v=>`<b>${n0(v)}</b>`,w:'11%'}],d,{sort:'CON',dir:'asc',pageSize:50,fixed:1,sticky:1});
 h+=`<div class="notebox" style="margin-top:12px">${loaiN2.length?`<b>Chỉ tính nợ nhóm 1.</b> Đã loại ${n0(loaiN2.length)} khế ước nhóm 2–5 (dư nợ ${n0(loaiN2.reduce((a,b)=>a+(b.DU_NO_TRD||0),0))} trđ) vì khách hàng không trả đúng hạn, không xem là khoản thu được — nhóm này theo dõi ở trang Cảnh báo và Chất lượng nợ. `:''}${TTNGAY?`<b>Đang lọc ngày ${esc(dOpt[TTNGAY]?dOpt[TTNGAY].ngay:'')}: ${n0(nKH(d))} khách hàng · ${n0(d.reduce((a,b)=>a+b.TONG,0))} trđ.</b> `:''}Ngày thanh toán lấy từ sao kê lịch trả nợ: ngày thu lãi theo tần suất và ngày thu gốc rơi trong tháng ${M.thang_lai}. Lãi là <b>số ước tính</b>. Trạng thái tính theo ngày chốt dữ liệu ${M.ngay_chot}. Chỉ tính khế ước LD.</div></div>`;
 return h}

 dl('LICH_THANH_TOAN_'+stamp()+(TTNGAY?'_ngay'+TTNGAY:'')+(F.rm?'_'+F.rm.replace(/\s+/g,''):'')+'.csv',toCSV(cols,TTVIEW));}

const PAGES=[['cb','⚑ Cảnh báo & hành động',pageCB],['tq','Tổng quan & chất lượng nợ',pageTQ],
 ['tt','📅 Lịch thanh toán',pageTT],['kh','Khách hàng 360°',pageKH],['rm','Quản trị RM',pageRM],
 ['ts','TSBĐ · Đáo hạn · HTLS',pageTS]];
function render(){
 const cb=cbF(),nDo=cb.filter(c=>c.MUC_DO==='ĐỎ').length;
 document.getElementById('nav').innerHTML=PAGES.map(p=>`<button class="${PAGE===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}${p[0]==='cb'&&nDo?`<span class="bdg">${nDo}</span>`:''}</button>`).join('');
 document.getElementById('page').innerHTML=PAGES.find(p=>p[0]===PAGE)[2]();

 const kh=khF();
 document.getElementById('subtitle').textContent=`${M.chi_nhanh} · Dư nợ chốt ${M.ngay_chot} · TSBĐ chốt ${M.ngay_chot_tsbd} · Nhóm nợ kỳ trước ${M.ky_truoc}`+(F.rm?` · Đang lọc RM: ${F.rm}`:'');
 document.getElementById('foot').innerHTML='';
}
function go(p){PAGE=p;LS.set('page',p);render();window.scrollTo({top:0,behavior:'smooth'})}
function initF(){
 const s=document.getElementById('fRM');
 s.innerHTML='<option value="">Toàn danh mục</option>'+M.rms.map(r=>`<option>${esc(r)}</option>`).join('');
 F.rm=LS.get('rm','');F.nn=LS.get('nn','');F.dn=Number(LS.get('dn',0))||0;
 s.value=F.rm;document.getElementById('fNN').value=F.nn;document.getElementById('fDN').value=F.dn||'';
 s.onchange=e=>{F.rm=e.target.value;LS.set('rm',F.rm);Object.values(SORT).forEach(x=>x.page=0);render()};
 document.getElementById('fNN').onchange=e=>{F.nn=e.target.value;LS.set('nn',F.nn);Object.values(SORT).forEach(x=>x.page=0);render()};
 document.getElementById('fDN').oninput=e=>{F.dn=Number(e.target.value)||0;LS.set('dn',F.dn);Object.values(SORT).forEach(x=>x.page=0);render()};
 PAGE=LS.get('page','cb');
}
